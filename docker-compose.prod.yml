# ─────────────────────────────────────────────────────────
# Docker Compose de PRODUÇÃO
# Sobe a stack completa: aplicação + PostgreSQL + Redis.
# Pensado para rodar numa VM (ex: Oracle Cloud ARM Ampere).
#
# Uso:
#   1. Copie .env.prod.example para .env e preencha os valores reais
#   2. docker compose -f docker-compose.prod.yml up -d --build
# ─────────────────────────────────────────────────────────

services:
  app:
    # Imagem pré-construída publicada no GitHub Container Registry pelo CI/CD.
    # A VM só faz pull — não compila nada localmente.
    image: ghcr.io/mrrenan/myfitnesspartner:latest
    container_name: myfitnesspartner-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILE: prod
      SERVER_PORT: 8080
      # Limita o heap da JVM — VM tem ~1GB RAM, então contemos o consumo.
      # MaxRAMPercentage=40 do limite de 512m do container ≈ ~205MB de heap.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=40 -XX:InitialRAMPercentage=20 -XX:+UseSerialGC"
      # Banco
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # IA — Gemini via Spring AI
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
    # Não expõe mais a 8080 para fora — só o Nginx acessa a app pela rede interna.
    expose:
      - "8080"
    # Limite de memória — usa SerialGC + heap contido para caber na VM pequena
    mem_limit: 512m
    mem_reservation: 384m
    networks:
      - myfitnesspartner-network

  postgres:
    image: postgres:16-alpine
    container_name: myfitnesspartner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Postgres enxuto para VM pequena
    command: >
      postgres
      -c shared_buffers=96MB
      -c max_connections=30
      -c effective_cache_size=256MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    mem_limit: 256m
    mem_reservation: 128m
    networks:
      - myfitnesspartner-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: myfitnesspartner-redis
    restart: unless-stopped
    # Redis com limite de memória e política de descarte
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    mem_limit: 96m
    mem_reservation: 48m
    networks:
      - myfitnesspartner-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────
  # Nginx — reverse proxy + terminação TLS.
  # Único serviço exposto à internet (portas 80 e 443).
  # Encaminha para a app na rede interna e bloqueia /actuator externamente.
  # ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: myfitnesspartner-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    mem_limit: 64m
    networks:
      - myfitnesspartner-network

  # ─────────────────────────────────────────────────────────
  # Certbot — emite e renova o certificado Let's Encrypt.
  # Compartilha volumes com o Nginx (certificados + desafio ACME).
  # ─────────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: myfitnesspartner-certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Renova a cada 12h se estiver perto de expirar (entrypoint padrão só roda uma vez;
    # este loop mantém o container renovando sozinho).
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - myfitnesspartner-network

volumes:
  postgres_data:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local

networks:
  myfitnesspartner-network:
    driver: bridge
