# ─────────────────────────────────────────────────────────
# Nginx — reverse proxy para o MyFitnessPartner
# fitness.renanleite.dev.br
# ─────────────────────────────────────────────────────────

# HTTP (porta 80): serve o desafio ACME e redireciona o resto para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fitness.renanleite.dev.br;

    # Desafio do Let's Encrypt (validação de domínio) — precisa ficar em HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo o resto vai para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (porta 443): o tráfego real da aplicação
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fitness.renanleite.dev.br;

    # Certificados emitidos pelo certbot
    ssl_certificate     /etc/letsencrypt/live/fitness.renanleite.dev.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitness.renanleite.dev.br/privkey.pem;

    # Configurações TLS modernas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Bloqueia o actuator para acesso externo ──
    # Os endpoints de monitoramento NÃO ficam expostos à internet.
    # Para consultá-los, use SSH na VM: curl localhost:8080/api/actuator/health
    location /api/actuator/ {
        deny all;
        return 403;
    }

    # Proxy para a aplicação Spring Boot (rede interna do Docker)
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
