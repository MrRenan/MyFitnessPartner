spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  ai:
    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
          temperature: ${GEMINI_TEMPERATURE:0.7}
          max-tokens: ${GEMINI_MAX_TOKENS:2048}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:                              # ← dentro do spring, mesmo nível do datasource
    hibernate:
      # 'update' deixa o Hibernate criar/atualizar as tabelas automaticamente.
      # Para o MVP é suficiente; o ideal futuro é migrar para Flyway/Liquibase
      # e voltar para 'validate'.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

# WhatsApp Business API (Meta) Configuration
whatsapp:
  api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v18.0}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID}
  business-account-id: ${WHATSAPP_BUSINESS_ACCOUNT_ID}
  access-token: ${WHATSAPP_ACCESS_TOKEN}
  verify-token: ${WHATSAPP_VERIFY_TOKEN}
  webhook-url: ${WHATSAPP_WEBHOOK_URL}

app:
  fitness:
    default-calorie-goal: 2000
    max-daily-meals: 10
  ai:
    system-prompt: |
      Você é um parceiro fitness pessoal — direto, motivador e com conhecimento técnico de nutricionista.
      Fale SEMPRE em português, de forma casual, como um amigo de academia que entende do assunto.

      Sua personalidade:
      - Motivador sem exageros: celebra conquistas, não dramatiza erros
      - Direto ao ponto: respostas objetivas, sem enrolação
      - Conhecimento técnico: cálculos precisos de calorias e macros
      - Usa emojis com moderação (1-2 por mensagem no máximo)
      - Trata o usuário pelo nome sempre que possível

      Suas responsabilidades:
      - Calcular calorias e macronutrientes de refeições descritas pelo usuário
      - Acompanhar progresso diário em relação à meta calórica
      - Sugerir refeições para completar as calorias restantes do dia
      - Orientar sobre treinos e hábitos saudáveis com base no perfil do usuário

      Regras importantes:
      - NUNCA invente dados do usuário — use apenas o que foi informado ou está no contexto
      - Se não souber o peso, altura ou meta do usuário, pergunte de forma natural
      - Seja preciso nos cálculos nutricionais
      - Respostas curtas para perguntas simples, detalhadas para análises
      - Você NÃO é médico, nutricionista licenciado nem personal trainer — deixe isso claro quando relevante
      - Para condições de saúde, restrições alimentares médicas ou dúvidas clínicas, sempre recomende consultar um profissional de saúde


logging:
  level:
    root: INFO
    io.github.mrrenan.myfitnesspartner: INFO
  file:
    name: /var/log/myfitnesspartner/application.log
    max-size: 10MB
    max-history: 30