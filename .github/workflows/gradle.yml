name: Java CI with Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Garante que o wrapper é executável (foi commitado do Windows)
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Compila o código principal e de teste
      - name: Compile
        run: ./gradlew compileJava compileTestJava

      # Roda apenas os testes unitários (exclui a tag 'integration',
      # que precisa de PostgreSQL/Redis/IA via Testcontainers ou infra real)
      - name: Unit tests
        run: ./gradlew unitTest

      # Empacota o JAR executável para garantir que o build de produção funciona
      - name: Build bootJar
        run: ./gradlew bootJar -x test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/
          retention-days: 7
