# ─────────────────────────────────────────────────────────
# Nginx — reverse proxy para o MyFitnessPartner
# fitness.renanleite.dev.br
# ─────────────────────────────────────────────────────────

# ── Rate limiting (protege a cota do Gemini e contra brute-force) ──
# Zonas por IP. "rate" = requisições sustentadas permitidas; o "burst"
# (definido em cada location) absorve rajadas curtas e legítimas.
#
# ai_limit: endpoints que chamam a IA (cada hit custa cota do Gemini) — restritivo
# auth_limit: login/registro — restritivo contra tentativa de força bruta
limit_req_zone $binary_remote_addr zone=ai_limit:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

# Resposta 429 (Too Many Requests) quando o limite estoura
limit_req_status 429;

# HTTP (porta 80): serve o desafio ACME e redireciona o resto para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fitness.renanleite.dev.br;

    # Desafio do Let's Encrypt (validação de domínio) — precisa ficar em HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo o resto vai para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (porta 443): o tráfego real da aplicação
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fitness.renanleite.dev.br;

    # Certificados emitidos pelo certbot
    ssl_certificate     /etc/letsencrypt/live/fitness.renanleite.dev.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitness.renanleite.dev.br/privkey.pem;

    # Configurações TLS modernas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Bloqueia o actuator para acesso externo ──
    # Os endpoints de monitoramento NÃO ficam expostos à internet.
    # Para consultá-los, use SSH na VM: curl localhost:8080/api/actuator/health
    location /api/actuator/ {
        deny all;
        return 403;
    }

    # Raiz → leva direto ao chat (a app vive sob o context-path /api)
    location = / {
        return 302 /api/index.html;
    }

    # ── Endpoints de IA: rate limit restritivo (protegem a cota do Gemini) ──
    # burst=5 permite pequenas rajadas; nodelay processa o burst na hora,
    # mas acima disso retorna 429.
    location /api/onboarding/ {
        limit_req zone=ai_limit burst=5 nodelay;
        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/conversations/ {
        limit_req zone=ai_limit burst=5 nodelay;
        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Auth: rate limit contra força bruta ──
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy para a aplicação Spring Boot (rede interna do Docker)
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
