name: Build & Deploy

# Dispara em push na main. O build acontece aqui no runner do GitHub
# (máquina potente); a VM Oracle só faz pull da imagem pronta e reinicia.
on:
  push:
    branches: ["main"]
  workflow_dispatch:   # permite acionar manualmente pela aba Actions

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────
  # 1. Compila o JAR, builda a imagem e publica no ghcr.io
  # ─────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # necessário para publicar no ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compila o JAR executável (sem testes — o CI gradle.yml já testou)
      - name: Build bootJar
        run: ./gradlew bootJar -x test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Converte o nome do repo para minúsculas (requisito do ghcr.io)
      - name: Set lowercase image name
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # ─────────────────────────────────────────────
  # 2. Conecta na VM via SSH e atualiza a aplicação
  # ─────────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/myfitness
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            # Nota: o pull funciona sem login porque o pacote no ghcr.io
            # está configurado como público (Package settings → Change visibility).
